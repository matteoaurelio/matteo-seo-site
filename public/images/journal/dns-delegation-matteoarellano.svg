<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1000" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Who controls what for matteoarellano.com</title>
  <desc id="d">Three levels of delegation. The root zone, managed by IANA and served by 12 operators, points .com to Verisign's servers. The .com zone, run by Verisign, points matteoarellano.com to Cloudflare's name servers, an entry set through the registrar. The matteoarellano.com zone lives at Cloudflare and holds the actual records that the site owner edits.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f4c81"/>
    </marker>
  </defs>
  <rect width="820" height="1000" fill="#ffffff"/>
  <text x="410" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0b2540">Who controls what for matteoarellano.com</text>
  <text x="410" y="82" text-anchor="middle" font-size="19" fill="#4a5a6a">Each level only says who is responsible for the next one.</text>

  <!-- Root -->
  <rect x="40" y="115" width="740" height="200" rx="18" fill="#ffffff" stroke="#0f4c81" stroke-width="2"/>
  <text x="70" y="157" font-size="15" font-weight="700" letter-spacing="1.5" fill="#4a5a6a">LEVEL 1 · THE ROOT ZONE</text>
  <text x="70" y="192" font-size="23" font-weight="700" fill="#0b2540">Managed by IANA, served by 12 root operators</text>
  <text x="70" y="226" font-size="18" fill="#4a5a6a">The national office: decides which body runs each TLD.</text>
  <rect x="70" y="244" width="680" height="48" rx="10" fill="#eaf2fa"/>
  <text x="90" y="275" font-size="19" fill="#0b2540" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">com.  →  a.gtld-servers.net … m.gtld-servers.net</text>

  <path d="M410 318 L410 372" stroke="#0f4c81" stroke-width="3" marker-end="url(#a)"/>
  <text x="426" y="352" font-size="16" fill="#0f4c81">delegates .com</text>

  <!-- .com -->
  <rect x="40" y="378" width="740" height="200" rx="18" fill="#ffffff" stroke="#0f4c81" stroke-width="2"/>
  <text x="70" y="420" font-size="15" font-weight="700" letter-spacing="1.5" fill="#4a5a6a">LEVEL 2 · THE .COM ZONE</text>
  <text x="70" y="455" font-size="23" font-weight="700" fill="#0b2540">Run by Verisign, the .com registry</text>
  <text x="70" y="489" font-size="18" fill="#4a5a6a">The regional office: records who is responsible for each name.</text>
  <rect x="70" y="507" width="680" height="48" rx="10" fill="#eaf2fa"/>
  <text x="90" y="538" font-size="19" fill="#0b2540" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">matteoarellano.com.  →  *.ns.cloudflare.com</text>

  <!-- registrar side note -->
  <rect x="520" y="600" width="260" height="96" rx="14" fill="#fff7e6" stroke="#d9a441" stroke-width="2"/>
  <text x="540" y="632" font-size="17" font-weight="700" fill="#5a4300">Registrar</text>
  <text x="540" y="658" font-size="15" fill="#5a4300">Where the domain was bought.</text>
  <text x="540" y="680" font-size="15" fill="#5a4300">Sends the NS entry to .com.</text>
  <path d="M650 598 L650 562" stroke="#d9a441" stroke-width="2.5" marker-end="url(#a)"/>

  <path d="M300 581 L300 735" stroke="#0f4c81" stroke-width="3" marker-end="url(#a)"/>
  <text x="284" y="665" text-anchor="end" font-size="16" fill="#0f4c81">delegates matteoarellano.com</text>

  <!-- zone -->
  <rect x="40" y="741" width="740" height="235" rx="18" fill="#0f4c81"/>
  <text x="70" y="783" font-size="15" font-weight="700" letter-spacing="1.5" fill="#cfe0f0">LEVEL 3 · THE MATTEOARELLANO.COM ZONE</text>
  <text x="70" y="818" font-size="23" font-weight="700" fill="#ffffff">Hosted on Cloudflare, edited by the site owner</text>
  <text x="70" y="852" font-size="18" fill="#cfe0f0">The local office: holds the actual answers.</text>
  <rect x="70" y="870" width="680" height="84" rx="10" fill="#ffffff" opacity="0.12"/>
  <text x="90" y="903" font-size="18" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">matteoarellano.com.  300  A    (Cloudflare IP)</text>
  <text x="90" y="937" font-size="18" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">plus mail, verification and other records</text>
</svg>
