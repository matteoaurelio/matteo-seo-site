<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 960" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">How a DNS lookup travels</title>
  <desc id="d">Your device checks its own caches, then asks a recursive resolver. On a cache miss the resolver asks a root server, then the .com TLD server, then the authoritative name server, and caches the answer for the record's TTL.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f4c81"/>
    </marker>
  </defs>
  <rect width="820" height="960" fill="#ffffff"/>

  <text x="410" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0b2540">How a DNS lookup travels</text>
  <text x="410" y="82" text-anchor="middle" font-size="19" fill="#4a5a6a">Most lookups stop at a cache. Only a miss walks the tree.</text>

  <!-- Device -->
  <rect x="30" y="120" width="340" height="190" rx="18" fill="#eaf2fa" stroke="#0f4c81" stroke-width="2"/>
  <text x="200" y="160" text-anchor="middle" font-size="23" font-weight="700" fill="#0b2540">Your device</text>
  <text x="200" y="188" text-anchor="middle" font-size="17" fill="#4a5a6a">(stub resolver)</text>
  <text x="56" y="228" font-size="18" fill="#0b2540">① Browser cache</text>
  <text x="56" y="258" font-size="18" fill="#0b2540">② OS cache + hosts file</text>
  <text x="56" y="288" font-size="18" fill="#0b2540">Hit? Done. Miss? Ask ↓</text>

  <!-- Recursive -->
  <rect x="30" y="420" width="340" height="230" rx="18" fill="#0f4c81"/>
  <text x="200" y="462" text-anchor="middle" font-size="23" font-weight="700" fill="#ffffff">Recursive resolver</text>
  <text x="200" y="490" text-anchor="middle" font-size="17" fill="#cfe0f0">ISP, 1.1.1.1, 8.8.8.8, office DNS</text>
  <text x="56" y="532" font-size="18" fill="#ffffff">③ Checks its own cache</text>
  <text x="56" y="562" font-size="18" fill="#ffffff">Miss? It does the walking:</text>
  <text x="56" y="592" font-size="18" fill="#ffffff">asks root → TLD → authoritative</text>
  <text x="56" y="622" font-size="18" fill="#ffffff">and remembers each answer</text>

  <path d="M200 312 L200 416" stroke="#0f4c81" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="214" y="370" font-size="16" fill="#0f4c81">"matteoarellano.com?"</text>

  <!-- Root -->
  <rect x="470" y="120" width="320" height="150" rx="18" fill="#ffffff" stroke="#0f4c81" stroke-width="2"/>
  <text x="630" y="160" text-anchor="middle" font-size="22" font-weight="700" fill="#0b2540">④ Root server</text>
  <text x="630" y="192" text-anchor="middle" font-size="17" fill="#4a5a6a">13 identities, ~2,000 instances</text>
  <text x="630" y="228" text-anchor="middle" font-size="18" fill="#0b2540">Knows: who runs .com</text>
  <text x="630" y="255" text-anchor="middle" font-size="16" fill="#4a5a6a">Answers with a referral</text>

  <!-- TLD -->
  <rect x="470" y="330" width="320" height="150" rx="18" fill="#ffffff" stroke="#0f4c81" stroke-width="2"/>
  <text x="630" y="370" text-anchor="middle" font-size="22" font-weight="700" fill="#0b2540">⑤ .com TLD server</text>
  <text x="630" y="402" text-anchor="middle" font-size="17" fill="#4a5a6a">Run by the registry</text>
  <text x="630" y="438" text-anchor="middle" font-size="18" fill="#0b2540">Knows: who hosts its DNS</text>
  <text x="630" y="465" text-anchor="middle" font-size="16" fill="#4a5a6a">Answers with a referral</text>

  <!-- Authoritative -->
  <rect x="470" y="540" width="320" height="150" rx="18" fill="#ffffff" stroke="#0f4c81" stroke-width="3"/>
  <text x="630" y="580" text-anchor="middle" font-size="22" font-weight="700" fill="#0b2540">⑥ Authoritative server</text>
  <text x="630" y="612" text-anchor="middle" font-size="17" fill="#4a5a6a">For this site: Cloudflare</text>
  <text x="630" y="648" text-anchor="middle" font-size="18" fill="#0b2540">Knows: the actual record</text>
  <text x="630" y="675" text-anchor="middle" font-size="16" fill="#4a5a6a">The only source of truth</text>

  <path d="M372 470 C 420 400, 420 220, 466 200" stroke="#0f4c81" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M372 520 C 410 470, 420 420, 466 410" stroke="#0f4c81" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M372 600 C 410 610, 430 615, 466 615" stroke="#0f4c81" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <!-- Answer back -->
  <rect x="30" y="740" width="760" height="190" rx="18" fill="#f6f8fb" stroke="#c9d6e3" stroke-width="2"/>
  <text x="56" y="782" font-size="22" font-weight="700" fill="#0b2540">⑦ The answer comes back with a TTL</text>
  <text x="56" y="818" font-size="18" fill="#0b2540">matteoarellano.com.  300  IN  A  (Cloudflare IP)</text>
  <text x="56" y="852" font-size="18" fill="#4a5a6a">Every cache on the way may keep it for up to 300 seconds.</text>
  <text x="56" y="882" font-size="18" fill="#4a5a6a">Change the record now, and some people still see the old one</text>
  <text x="56" y="910" font-size="18" fill="#4a5a6a">until their cache expires. That is "propagation".</text>
</svg>
